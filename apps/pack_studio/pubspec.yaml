name: pack_studio
description: "Editor for d30mode content packs."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  d30_engine:
    path: ../../packages/d30_engine
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/placeholder/
    - assets/workshop/
    - assets/workshop/events/

